<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lite-camera-pro · Day 3 — Multi-Target Framing</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;600;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0f;color:#e2e0d8;font-family:'Outfit',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
  header{padding:24px 0 10px;text-align:center}
  header h1{font-size:1.05rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:#fbbf24;margin-bottom:2px}
  header p{font-size:.72rem;color:#6b7280;font-family:'JetBrains Mono',monospace}
  #wrap{position:relative;border:1px solid #1e1e2a;border-radius:6px;overflow:hidden;box-shadow:0 0 60px rgba(251,191,36,.04)}
  canvas{display:block;background:#111118;cursor:crosshair}
  .controls{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;justify-content:center;padding:0 12px}
  .controls button{font-family:'JetBrains Mono',monospace;font-size:.68rem;padding:6px 12px;background:#1a1a24;color:#d4d0c8;border:1px solid #2a2a3a;border-radius:4px;cursor:pointer;transition:all .15s}
  .controls button:hover{background:#2a2a3a}
  .controls button.active{background:#fbbf24;color:#0a0a0f;border-color:#fbbf24}
  .row-label{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:#4b5563;padding-top:4px;width:100%;text-align:center}
  .hint{margin-top:8px;font-size:.62rem;color:#4b5563;font-family:'JetBrains Mono',monospace;text-align:center;padding-bottom:16px;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>lite-camera-pro</h1>
  <p>day 3 — multi-target framing (boss fight)</p>
</header>
<div id="wrap"><canvas id="c"></canvas></div>
<div class="controls">
  <div class="row-label">tracking</div>
  <button id="btn-single" onclick="setSingle()" class="active">single target</button>
  <button id="btn-multi" onclick="setMulti()">multi-target (boss fight)</button>
  <button id="btn-three" onclick="setThree()">3 targets</button>
  <div class="row-label">actions</div>
  <button onclick="cam.addTrauma(0.6)">shake</button>
  <button onclick="spawnMinion()">+ minion</button>
  <button onclick="resetMinions()">clear minions</button>
</div>
<p class="hint">WASD to move · boss patrols autonomously · multi-target auto-zooms to keep everyone visible</p>

<script>
// ═══════════════════════════════════════════════════
//  INLINED DEPS
// ═══════════════════════════════════════════════════
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOutExpo=t=>t===1?1:1-Math.pow(2,-10*t);
const easeOutCubic=t=>1-Math.pow(1-t,3);
class Random{constructor(s=42){this.seed=s;this._state=s}next(){let t=this._state+=0x6D2B79F5;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}

// ═══════════════════════════════════════════════════
//  FOLLOW STRATEGIES (from Day 2)
// ═══════════════════════════════════════════════════
const FollowMode={SMOOTH:0,LOCK:1,PREDICTIVE:2,CUT:3,HYBRID:4};
function fSmooth(cam,dt,px,py,pvx,pvy){
  const len=Math.sqrt(pvx*pvx+pvy*pvy);
  const tlx=len>0?(pvx/len)*cam.lookaheadDist:0;
  const tly=len>0?(pvy/len)*cam.lookaheadDist:0;
  cam.look[0]+=(tlx-cam.look[0])*cam.lookaheadSpeed*dt;
  cam.look[1]+=(tly-cam.look[1])*cam.lookaheadSpeed*dt;
  const hvw=cam.visibleW*.5,hvh=cam.visibleH*.5;
  const dx=px+cam.look[0]-hvw,dy=py+cam.look[1]-hvh;
  if(dx<cam.target[0]-cam.deadzoneX)cam.target[0]=dx+cam.deadzoneX;
  else if(dx>cam.target[0]+cam.deadzoneX)cam.target[0]=dx-cam.deadzoneX;
  if(dy<cam.target[1]-cam.deadzoneY)cam.target[1]=dy+cam.deadzoneY;
  else if(dy>cam.target[1]+cam.deadzoneY)cam.target[1]=dy-cam.deadzoneY;
}
const STRATEGIES=[fSmooth];

// ═══════════════════════════════════════════════════
//  MULTI-TARGET (Day 3)
// ═══════════════════════════════════════════════════
function updateMultiTarget(cam,dt,targets,count){
  if(count===0)return;
  const mt=cam._mt;
  let minX=targets[0].x,maxX=minX,minY=targets[0].y,maxY=minY;
  for(let i=1;i<count;i++){
    const tx=targets[i].x,ty=targets[i].y;
    if(tx<minX)minX=tx;if(tx>maxX)maxX=tx;
    if(ty<minY)minY=ty;if(ty>maxY)maxY=ty;
  }
  const cx=(minX+maxX)*.5,cy=(minY+maxY)*.5;
  const bw=(maxX-minX)+mt.paddingX*2,bh=(maxY-minY)+mt.paddingY*2;
  const zx=cam.viewW/(bw||1),zy=cam.viewH/(bh||1);
  let dz=Math.min(zx,zy);
  if(dz<cam.minZoom)dz=cam.minZoom;if(dz>cam.maxZoom)dz=cam.maxZoom;
  if(dz<mt.minZoom)dz=mt.minZoom;if(dz>mt.maxZoom)dz=mt.maxZoom;
  const zl=1-Math.exp(-mt.zoomSpeed*dt);
  cam.zoom+=(dz-cam.zoom)*zl;
  cam.visibleW=cam.viewW/cam.zoom;cam.visibleH=cam.viewH/cam.zoom;
  cam._maxX=cam.worldW-cam.visibleW;cam._maxY=cam.worldH-cam.visibleH;
  if(cam._maxX<0)cam._maxX=0;if(cam._maxY<0)cam._maxY=0;
  const desX=cx-cam.visibleW*.5,desY=cy-cam.visibleH*.5;
  const pl=1-Math.exp(-mt.followSpeed*dt);
  cam.target[0]+=(desX-cam.target[0])*pl;
  cam.target[1]+=(desY-cam.target[1])*pl;
  cam.look[0]=0;cam.look[1]=0;
}

// ═══════════════════════════════════════════════════
//  CAMERA PRO (Days 1-3)
// ═══════════════════════════════════════════════════
class CinematicCameraPro{
  constructor(vw,vh,ww,wh,seed=42){
    this.viewW=vw;this.viewH=vh;this.worldW=ww;this.worldH=wh;
    this.pos=new Float32Array(2);this.target=new Float32Array(2);this.look=new Float32Array(2);
    this.deadzoneX=40;this.deadzoneY=40;this.lookaheadDist=80;this.lookaheadSpeed=8;this.lerpSpeed=5;
    this.shakeTrauma=0;this.shakeMaxOffset=15;this.shakeMaxAngle=.05;this.rng=new Random(seed);
    this._halfW=vw*.5;this._halfH=vh*.5;this._maxX=ww-vw;this._maxY=wh-vh;
    this.zoom=1;this.minZoom=.25;this.maxZoom=4;
    this._zoomFrom=1;this._zoomTo=1;this._zoomDur=0;this._zoomElapsed=0;this._zoomEase=null;
    this._zoomAnchorX=0;this._zoomAnchorY=0;this._zoomTarget=null;this._hasAnchor=false;
    this.visibleW=vw;this.visibleH=vh;
    this.mode=FollowMode.SMOOTH;this.predictTime=.3;this.hybridVerticalSnap=true;
    this._mt={active:false,targets:null,count:0,paddingX:80,paddingY:80,minZoom:.3,maxZoom:2,zoomSpeed:4,followSpeed:5};
  }
  addTrauma(a){this.shakeTrauma=Math.min(1,this.shakeTrauma+a)}
  setMode(m){this.mode=m;return this}
  trackMultiple(targets,opts){
    const mt=this._mt;mt.active=true;mt.targets=targets;mt.count=targets.length;
    if(opts){
      if(opts.paddingX!==undefined)mt.paddingX=opts.paddingX;
      if(opts.paddingY!==undefined)mt.paddingY=opts.paddingY;
      if(opts.padding!==undefined){mt.paddingX=mt.paddingY=opts.padding;}
      if(opts.minZoom!==undefined)mt.minZoom=opts.minZoom;
      if(opts.maxZoom!==undefined)mt.maxZoom=opts.maxZoom;
      if(opts.zoomSpeed!==undefined)mt.zoomSpeed=opts.zoomSpeed;
      if(opts.followSpeed!==undefined)mt.followSpeed=opts.followSpeed;
    }
    return this;
  }
  trackSingle(){this._mt.active=false;this._mt.targets=null;this._mt.count=0;return this}
  setTargetCount(n){this._mt.count=n;return this}
  setZoom(level,dur=0,ease=null){
    level=clamp(level,this.minZoom,this.maxZoom);
    if(dur<=0){this.zoom=level;this._zoomDur=0;this._hasAnchor=false;this._ub();return this}
    this._zoomFrom=this.zoom;this._zoomTo=level;this._zoomDur=dur;this._zoomElapsed=0;this._zoomEase=ease;this._hasAnchor=false;return this;
  }
  screenToWorld(sx,sy,out){out.x=this.pos[0]+sx/this.zoom;out.y=this.pos[1]+sy/this.zoom;return out}
  _ub(){
    this.visibleW=this.viewW/this.zoom;this.visibleH=this.viewH/this.zoom;
    this._maxX=this.worldW-this.visibleW;this._maxY=this.worldH-this.visibleH;
    if(this._maxX<0)this._maxX=0;if(this._maxY<0)this._maxY=0;
  }
  _adj(oz,nz){
    if(!this._hasAnchor||nz===0)return;
    const r=oz/nz;
    const nx=this._zoomAnchorX-(this._zoomAnchorX-this.pos[0])*r;
    const ny=this._zoomAnchorY-(this._zoomAnchorY-this.pos[1])*r;
    this.pos[0]=nx;this.pos[1]=ny;this.target[0]=nx;this.target[1]=ny;
  }
  update(dt,px,py,pvx=0,pvy=0){
    const mt=this._mt;
    if(mt.active&&mt.targets&&mt.count>0){
      updateMultiTarget(this,dt,mt.targets,mt.count);
    }else{
      const pz=this.zoom;
      if(this._zoomDur>0){
        this._zoomElapsed+=dt;let t=clamp(this._zoomElapsed/this._zoomDur,0,1);
        if(this._zoomEase)t=this._zoomEase(t);this.zoom=lerp(this._zoomFrom,this._zoomTo,t);
        if(this._zoomElapsed>=this._zoomDur){this.zoom=this._zoomTo;this._zoomDur=0;}
      }
      if(this._hasAnchor&&this._zoomTarget){this._zoomAnchorX=this._zoomTarget.x;this._zoomAnchorY=this._zoomTarget.y;}
      if(this._hasAnchor&&pz!==this.zoom)this._adj(pz,this.zoom);
      if(this._zoomDur<=0){this._hasAnchor=false;this._zoomTarget=null;}
      this._ub();
      STRATEGIES[this.mode](this,dt,px,py,pvx,pvy);
    }
    this.target[0]=this.target[0]<0?0:(this.target[0]>this._maxX?this._maxX:this.target[0]);
    this.target[1]=this.target[1]<0?0:(this.target[1]>this._maxY?this._maxY:this.target[1]);
    this.pos[0]+=(this.target[0]-this.pos[0])*this.lerpSpeed*dt;
    this.pos[1]+=(this.target[1]-this.pos[1])*this.lerpSpeed*dt;
    if(this.shakeTrauma>0)this.shakeTrauma=Math.max(0,this.shakeTrauma-dt);
  }
  apply(ctx){
    let ox=0,oy=0,a=0;
    if(this.shakeTrauma>0){const s=this.shakeTrauma*this.shakeTrauma;
      ox=Math.fround(this.shakeMaxOffset*s*(this.rng.next()*2-1));
      oy=Math.fround(this.shakeMaxOffset*s*(this.rng.next()*2-1));
      a=Math.fround(this.shakeMaxAngle*s*(this.rng.next()*2-1));}
    ctx.translate(ox,oy);ctx.translate(this._halfW,this._halfH);ctx.rotate(a);
    ctx.scale(this.zoom,this.zoom);ctx.translate(-this._halfW/this.zoom,-this._halfH/this.zoom);
    ctx.translate(-(this.pos[0]|0),-(this.pos[1]|0));
  }
  debugHUD(ctx){
    ctx.save();
    const mt=this._mt;
    const h=mt.active?96:82;
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(4,4,220,h);
    ctx.font='11px "JetBrains Mono",monospace';
    ctx.fillStyle=mt.active?'#a78bfa':'#fbbf24';
    ctx.fillText(mt.active?`MULTI-TARGET (${mt.count})`:' SINGLE TARGET',10,18);
    ctx.fillStyle='#fbbf24';
    ctx.fillText(`zoom: ${this.zoom.toFixed(2)}`,10,32);
    ctx.fillText(`pos: ${this.pos[0].toFixed(1)}, ${this.pos[1].toFixed(1)}`,10,46);
    ctx.fillText(`vis: ${this.visibleW.toFixed(0)} × ${this.visibleH.toFixed(0)}`,10,60);
    ctx.fillText(`bounds: ${this._maxX.toFixed(0)} × ${this._maxY.toFixed(0)}`,10,74);
    if(this.shakeTrauma>0){ctx.fillStyle='#ef4444';ctx.fillText(`trauma: ${this.shakeTrauma.toFixed(2)}`,10,88);}
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════
//  DEMO SCENE — Boss Fight
// ═══════════════════════════════════════════════════
const CW=Math.min(800,window.innerWidth-24),CH=480,WW=2400,WH=1600;
const canvas=document.getElementById('c');
canvas.width=CW;canvas.height=CH;
document.getElementById('wrap').style.width=CW+'px';
const ctx=canvas.getContext('2d');
const cam=new CinematicCameraPro(CW,CH,WW,WH);
window.cam=cam;

// Player
const player={x:600,y:800,vx:0,vy:0,speed:280,size:16};

// Boss — autonomous patrol
const boss={x:1800,y:800,vx:0,vy:0,size:28,
  // Patrol waypoints
  wp:[[1800,400],[600,400],[600,1200],[1800,1200]],
  wpi:0, speed:120
};

// Minions — spawnable extra targets
const minions=[];
const rng=new Random(77);

function spawnMinion(){
  minions.push({
    x:400+rng.next()*1600, y:400+rng.next()*800,
    vx:(rng.next()-.5)*100, vy:(rng.next()-.5)*100,
    size:10, hue:(rng.next()*360)|0
  });
  if(cam._mt.active) updateTrackingTargets();
}
function resetMinions(){
  minions.length=0;
  if(cam._mt.active) updateTrackingTargets();
}
window.spawnMinion=spawnMinion;
window.resetMinions=resetMinions;

// All trackable targets (pre-allocated array, resized as needed)
let trackTargets=[player,boss];

function updateTrackingTargets(){
  trackTargets=[player,boss,...minions];
  cam._mt.targets=trackTargets;
  cam._mt.count=trackTargets.length;
}

// Input
const keys={};
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

// Mode buttons
window.setSingle=()=>{
  cam.trackSingle();cam.setZoom(1,.4,easeOutCubic);
  document.getElementById('btn-single').classList.add('active');
  document.getElementById('btn-multi').classList.remove('active');
  document.getElementById('btn-three').classList.remove('active');
};
window.setMulti=()=>{
  trackTargets=[player,boss];
  cam.trackMultiple(trackTargets,{padding:120,minZoom:.4,maxZoom:1.8});
  document.getElementById('btn-single').classList.remove('active');
  document.getElementById('btn-multi').classList.add('active');
  document.getElementById('btn-three').classList.remove('active');
};
window.setThree=()=>{
  if(minions.length===0) spawnMinion();
  updateTrackingTargets();
  cam.trackMultiple(trackTargets,{padding:100,minZoom:.3,maxZoom:1.5});
  document.getElementById('btn-single').classList.remove('active');
  document.getElementById('btn-multi').classList.remove('active');
  document.getElementById('btn-three').classList.add('active');
};

// Boss AI
function updateBoss(dt){
  const wp=boss.wp[boss.wpi];
  const dx=wp[0]-boss.x, dy=wp[1]-boss.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<10){boss.wpi=(boss.wpi+1)%boss.wp.length;return;}
  boss.vx=(dx/dist)*boss.speed;
  boss.vy=(dy/dist)*boss.speed;
  boss.x+=boss.vx*dt;
  boss.y+=boss.vy*dt;
}

// Minion AI
function updateMinions(dt){
  for(const m of minions){
    m.x+=m.vx*dt; m.y+=m.vy*dt;
    if(m.x<50||m.x>WW-50)m.vx*=-1;
    if(m.y<50||m.y>WH-50)m.vy*=-1;
    m.x=clamp(m.x,50,WW-50);
    m.y=clamp(m.y,50,WH-50);
  }
}

// ── Drawing ──
const landmarks=[];
const rng2=new Random(99);
for(let i=0;i<30;i++){landmarks.push({x:60+rng2.next()*(WW-120),y:60+rng2.next()*(WH-120),r:10+rng2.next()*30,hue:(rng2.next()*360)|0});}

function drawWorld(){
  ctx.fillStyle='#13131d';ctx.fillRect(0,0,WW,WH);
  ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=1;
  for(let x=0;x<=WW;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,WH);ctx.stroke();}
  for(let y=0;y<=WH;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WW,y);ctx.stroke();}
  ctx.strokeStyle='rgba(239,68,68,.3)';ctx.lineWidth=2;ctx.strokeRect(0,0,WW,WH);
  for(const lm of landmarks){
    ctx.fillStyle=`hsla(${lm.hue},60%,45%,.25)`;ctx.beginPath();ctx.arc(lm.x,lm.y,lm.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=`hsla(${lm.hue},70%,55%,.4)`;ctx.lineWidth=1;ctx.stroke();
  }
  // Boss patrol path
  ctx.strokeStyle='rgba(239,68,68,.15)';ctx.lineWidth=1;ctx.setLineDash([6,6]);
  ctx.beginPath();
  for(let i=0;i<boss.wp.length;i++){const p=boss.wp[i];i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]);}
  ctx.closePath();ctx.stroke();ctx.setLineDash([]);
}

function drawPlayer(){
  ctx.fillStyle='#fbbf24';
  ctx.fillRect(player.x-player.size,player.y-player.size,player.size*2,player.size*2);
  ctx.fillStyle='rgba(251,191,36,.3)';ctx.font='10px monospace';ctx.fillText('PLAYER',player.x-18,player.y-player.size-6);
}

function drawBoss(){
  const s=boss.size;
  // Pulsing glow
  const pulse=Math.sin(performance.now()*.003)*.3+.7;
  ctx.fillStyle=`rgba(239,68,68,${pulse*.3})`;
  ctx.beginPath();ctx.arc(boss.x,boss.y,s+8,0,Math.PI*2);ctx.fill();
  // Body
  ctx.fillStyle='#ef4444';
  ctx.beginPath();ctx.arc(boss.x,boss.y,s,0,Math.PI*2);ctx.fill();
  // Eyes
  ctx.fillStyle='#fff';
  ctx.fillRect(boss.x-10,boss.y-8,6,6);ctx.fillRect(boss.x+4,boss.y-8,6,6);
  ctx.fillStyle='rgba(239,68,68,.3)';ctx.font='10px monospace';ctx.fillText('BOSS',boss.x-12,boss.y-s-8);
}

function drawMinions(){
  for(const m of minions){
    ctx.fillStyle=`hsla(${m.hue},70%,60%,.6)`;
    ctx.beginPath();ctx.arc(m.x,m.y,m.size,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=`hsla(${m.hue},70%,70%,.4)`;ctx.lineWidth=1;ctx.stroke();
  }
}

function drawBBox(){
  if(!cam._mt.active)return;
  const targets=cam._mt.targets;
  const count=cam._mt.count;
  if(!targets||count<2)return;
  let minX=targets[0].x,maxX=minX,minY=targets[0].y,maxY=minY;
  for(let i=1;i<count;i++){
    if(targets[i].x<minX)minX=targets[i].x;if(targets[i].x>maxX)maxX=targets[i].x;
    if(targets[i].y<minY)minY=targets[i].y;if(targets[i].y>maxY)maxY=targets[i].y;
  }
  const pad=cam._mt.paddingX;
  ctx.strokeStyle='rgba(167,139,250,.35)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
  ctx.strokeRect(minX-pad,minY-pad,(maxX-minX)+pad*2,(maxY-minY)+pad*2);
  ctx.setLineDash([]);
  // Center crosshair
  const cx=(minX+maxX)*.5,cy=(minY+maxY)*.5;
  ctx.strokeStyle='rgba(167,139,250,.5)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(cx-10,cy);ctx.lineTo(cx+10,cy);ctx.moveTo(cx,cy-10);ctx.lineTo(cx,cy+10);ctx.stroke();
}

// ── Loop ──
let lastTime=performance.now();
function loop(now){
  const dt=Math.min((now-lastTime)/1000,.05);lastTime=now;

  // Input
  player.vx=0;player.vy=0;
  if(keys['w']||keys['arrowup'])player.vy=-1;
  if(keys['s']||keys['arrowdown'])player.vy=1;
  if(keys['a']||keys['arrowleft'])player.vx=-1;
  if(keys['d']||keys['arrowright'])player.vx=1;
  const il=Math.sqrt(player.vx*player.vx+player.vy*player.vy);
  if(il>0){player.vx/=il;player.vy/=il;}
  player.x+=player.vx*player.speed*dt;
  player.y+=player.vy*player.speed*dt;
  player.x=clamp(player.x,player.size,WW-player.size);
  player.y=clamp(player.y,player.size,WH-player.size);

  updateBoss(dt);
  updateMinions(dt);

  cam.update(dt,player.x,player.y,player.vx*player.speed,player.vy*player.speed);

  ctx.clearRect(0,0,CW,CH);
  ctx.save();
  cam.apply(ctx);
  drawWorld();
  drawBBox();
  drawMinions();
  drawBoss();
  drawPlayer();
  ctx.restore();
  cam.debugHUD(ctx);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
