<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lite-camera-pro &#xB7; Interactive Tour</title>
    <style>
        :root {
            --display: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            color: #e2e0d8;
            font-family: var(--display);
            display: flex;
            height: 100dvh;
            overflow: hidden;
        }

        /* Sidebar UI */
        #sidebar {
            width: 320px;
            background: #111118;
            border-right: 1px solid #1e1e2a;
            display: flex;
            flex-direction: column;
            padding: 24px;
            z-index: 10;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #fbbf24;
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.75rem;
            color: #6b7280;
            font-family: var(--mono);
            margin-bottom: 24px;
        }

        .scenario-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .scenario-btn {
            background: transparent;
            border: 1px solid #2a2a3a;
            color: #8b8b9a;
            text-align: left;
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--display);
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        @media (hover: hover) {
            .scenario-btn:hover {
                border-color: #fbbf24;
                color: #d4d0c8;
            }
        }

        .scenario-btn.active {
            background: rgba(251, 191, 36, 0.1);
            border-color: #fbbf24;
            color: #fbbf24;
        }

        .scenario-desc {
            margin-top: 24px;
            padding: 16px;
            background: #1a1a24;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #a1a1aa;
            line-height: 1.5;
            min-height: 120px;
        }

        .scenario-desc strong {
            color: #e2e0d8;
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        #desc-body {
            white-space: pre-line;
        }

        /* Action Buttons specific to scenarios */
        #action-container {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #2a2a3a;
            color: #d4d0c8;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-family: var(--mono);
            font-size: 0.7rem;
            cursor: pointer;
        }

        @media (hover: hover) {
            .action-btn:hover {
                background: #fbbf24;
                color: #0a0a0f;
            }
        }

        /* Main Canvas Area */
        #viewport {
            flex-grow: 1;
            position: relative;
            background: #0a0a0f;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay-hint {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: var(--mono);
            font-size: 0.75rem;
            color: #fbbf24;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="sidebar">
    <header>
        <h1>lite-camera-pro</h1>
        <p>Interactive Cookbook Tour <span id="version-stamp"></span></p>
    </header>

    <div class="scenario-list" id="scenario-list">
    </div>

    <div class="scenario-desc" id="scenario-desc">
        <strong id="desc-head"></strong>
        <p id="desc-body"></p>
        <div id="action-container"></div>
    </div>
</div>

<div id="viewport">
    <canvas id="gameCanvas"></canvas>
    <div class="overlay-hint">WASD to move</div>
</div>

<!-- Import map: 7 local entries (identical to CameraProModule.html). The two
     transitive specifiers (lite-random, lite-ticker) are what keep the page
     alive offline -- a browser importmap does no node resolution. -->
<script type="importmap">
{
  "imports": {
    "@zakkster/lite-camera": "../node_modules/@zakkster/lite-camera/CinematicCamera.js",
    "@zakkster/lite-lerp": "../node_modules/@zakkster/lite-lerp/Lerp.js",
    "@zakkster/lite-ease": "../node_modules/@zakkster/lite-ease/LiteEase.js",
    "@zakkster/lite-noise": "../node_modules/@zakkster/lite-noise/Noise.js",
    "@zakkster/lite-timeline": "../node_modules/@zakkster/lite-timeline/Timeline.js",
    "@zakkster/lite-random": "../node_modules/@zakkster/lite-camera/node_modules/@zakkster/lite-random/Random.js",
    "@zakkster/lite-ticker": "../node_modules/@zakkster/lite-timeline/node_modules/@zakkster/lite-ticker/Ticker.js"
  }
}
</script>

<script type="module">
    // v2.0.0 detach: parallax/sequence/debug left the "." barrel; opt in per
    // instance from their own module files (the ./parallax, ./sequence, ./debug
    // subpaths). Relative source imports -- no importmap entry needed.
    import {CinematicCameraPro, FollowMode, BoundsType, VERSION} from '../src/index.js';
    import { withParallax } from '../src/ParallaxManager.js';
    import { withSequences } from '../src/CameraSequence.js';
    import { withDebug } from '../src/DebugHUD.js';

    // ---------------------------------------------------------
    //  ENGINE SETUP
    // ---------------------------------------------------------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Resize handler
    function resize() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }

    window.addEventListener('resize', resize);
    resize();

    const WORLD_W = 3200;
    const WORLD_H = 2400;

    // The Pro Camera
    const cam = new CinematicCameraPro(canvas.width, canvas.height, WORLD_W, WORLD_H);
    // v2.0.0 detach: opt in to parallax, sequences and debug once, after
    // construction. withDebug builds cam.debugConfig (the constructor no longer
    // does), so it must run before the config is touched below.
    withParallax(cam);
    withSequences(cam);
    withDebug(cam);
    // Show debug HUD by default
    cam.debugConfig.show.shake = true;
    cam.debugConfig.show.bounds = true;

    // CP-7 (2.1.0): dims are readonly on the typed surface; cam.resize() is the
    // one blessed write path (re-derives the visible box, re-clamps the pose).
    // Registered AFTER the canvas-sizing 'resize' listener above, so the canvas
    // dims are already current when this fires (listeners run in FIFO order).
    window.addEventListener('resize', () => cam.resize(canvas.width, canvas.height, WORLD_W, WORLD_H));

    // Game State
    const player = {x: 400, y: 400, vx: 0, vy: 0, speed: 300, size: 16};
    const boss = {x: 1800, y: 1200, size: 32};
    const ally = {x: 500, y: 500, vx: 1, vy: 1, size: 14, active: false};

    const keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // ---------------------------------------------------------
    //  SCENARIO DEFINITIONS (The Cookbook Tour)
    // ---------------------------------------------------------

    const scenarios = [
        {
            id: 'smooth',
            title: '02 \u2014 Smooth Follow',
            head: 'The Default Glide',
            body: 'The camera uses a deadzone and lookahead to smoothly follow the player. Notice how small movements don\'t jerk the camera around.',
            setup: () => {
                cam.setMode(FollowMode.SMOOTH);
                cam.deadzoneX = 60;
                cam.deadzoneY = 40;
                cam.lookaheadDist = 80;
                cam.setZoom(1.0, 0.5);
                cam.clearBoundsRect();
                cam.setBoundsType(BoundsType.HARD);
            },
            teardown: () => {
            }
        },
        {
            id: 'lock',
            title: '04 \u2014 Twin-Stick Lock',
            head: 'Zero Lag Precision',
            body: 'The camera locks instantly to the player. No smoothing, no deadzone. Perfect for top-down shooters where aim is critical.\n\nClick anywhere to fire and see directional recoil.',
            setup: () => {
                cam.setMode(FollowMode.LOCK);
                cam.setZoom(1.2, 0.5);
            },
            teardown: () => {
            },
            onClick: (worldX, worldY) => {
                // Calculate direction from player to click
                const dx = player.x - worldX;
                const dy = player.y - worldY;
                const len = Math.sqrt(dx * dx + dy * dy);
                // Apply directional recoil in the OPPOSITE direction of the shot
                cam.shake({trauma: 0.5, freq: 25, decay: 3, maxOffset: 15, dirX: dx / len, dirY: dy / len});
            }
        },
        {
            id: 'hybrid',
            title: '03 \u2014 Platformer Hybrid',
            head: 'Solid Vertical, Smooth Horizontal',
            body: 'Horizontal movement is smoothed, but vertical movement locks tightly to the player. Prevents the camera from "swimming" during jumps.',
            setup: () => {
                cam.setMode(FollowMode.HYBRID);
                cam.hybridVerticalSnap = true;
                cam.deadzoneX = 80;
                cam.setZoom(1.0, 0.5);
            },
            teardown: () => {
            }
        },
        {
            id: 'bounds',
            title: '16 \u2014 Soft Edge Bounds',
            head: 'Graceful Deceleration',
            body: 'Walk to the edge of the world. Instead of hitting a brick wall, the camera smoothly decelerates using a custom soft zone.',
            setup: () => {
                cam.setMode(FollowMode.SMOOTH);
                cam.setBoundsType(BoundsType.SOFT);
                cam._bounds.softZone = 150; // 150px gradient at world edges
                cam.setZoom(0.8, 0.5);
            },
            teardown: () => {
                cam.setBoundsType(BoundsType.HARD);
            }
        },
        {
            id: 'parallax',
            title: '19 \u2014 Deep Parallax',
            head: 'Instant Depth',
            body: 'We\'ve registered 3 parallax layers (sky, mountains, foreground). Move around to see them scroll at different multipliers relative to the camera.',
            setup: () => {
                cam.setMode(FollowMode.SMOOTH);
                cam.addParallaxLayer('sky', 0.05);
                cam.addParallaxLayer('mountains', 0.2);
                cam.addParallaxLayer('foreground', 1.4);
            },
            teardown: () => {
                cam.removeParallaxLayer('sky');
                cam.removeParallaxLayer('mountains');
                cam.removeParallaxLayer('foreground');
            }
        },
        {
            id: 'multitarget',
            title: '15 \u2014 Co-op Framing',
            head: 'Auto-Zoom Bounding Box',
            body: 'An ally has spawned. The camera abandons follow mode and automatically manages position and zoom to keep both targets perfectly framed.',
            setup: () => {
                ally.active = true;
                ally.x = player.x + 100;
                ally.y = player.y + 100;
                cam.trackMultiple([player, ally], {padding: 150, minZoom: 0.5, maxZoom: 1.5});
            },
            teardown: () => {
                ally.active = false;
                cam.trackSingle();
                cam.setZoom(1.0, 0.5);
            }
        },
        {
            id: 'sequence',
            title: '12 \u2014 Boss Reveal Sequence',
            head: 'Cinematic Timeline Control',
            body: 'Click the button below to hand control over to a pre-choreographed timeline sequence. It pans, zooms, shakes, and returns.',
            setup: () => {
                cam.setMode(FollowMode.SMOOTH);
                renderActions([
                    {
                        label: 'Play Reveal', action: () => {
                            const seq = cam.createSequence()
                                .moveAndZoom(boss.x, boss.y, 1.8, 1200)
                                .shake('heavy_impact')
                                .wait(800)
                                .moveAndZoom(player.x, player.y, 1.0, 1000);
                            cam.playSequence(seq);
                        }
                    }
                ]);
            },
            teardown: () => {
                cam.stopSequence();
            }
        }
    ];

    let currentScenarioIndex = -1;

    // ---------------------------------------------------------
    //  UI CONTROLLER
    // ---------------------------------------------------------

    // DOM cache (all lookups hoisted to init; none inside a handler or loop).
    const $list = document.getElementById('scenario-list');
    const $descHead = document.getElementById('desc-head');
    const $descBody = document.getElementById('desc-body');
    const $actions = document.getElementById('action-container');
    const $version = document.getElementById('version-stamp');

    // Stamp the version once, from the library's own VERSION const (D-d).
    $version.textContent = 'v' + VERSION;

    // Pre-allocated out-vector for screenToWorld -- no {x, y} literal per click.
    const tmpVec = {x: 0, y: 0};

    // Canvas rect cached at init; refreshed on resize + scroll, never per click.
    let canvasRect = canvas.getBoundingClientRect();
    function refreshCanvasRect() { canvasRect = canvas.getBoundingClientRect(); }
    window.addEventListener('resize', refreshCanvasRect);
    window.addEventListener('scroll', refreshCanvasRect, true);

    function loadScenario(index) {
        if (currentScenarioIndex >= 0) {
            scenarios[currentScenarioIndex].teardown();
        }

        currentScenarioIndex = index;
        const s = scenarios[index];

        for (let i = 0; i < scenarioBtns.length; i++) {
            scenarioBtns[i].classList.toggle('active', i === index);
        }

        // Persistent nodes updated by textContent; the action row is cleared
        // with replaceChildren() -- no markup strings, no per-switch re-lookup.
        $descHead.textContent = s.head;
        $descBody.textContent = s.body;
        $actions.replaceChildren();

        s.setup();
    }

    function renderActions(actions) {
        $actions.replaceChildren();
        for (let i = 0; i < actions.length; i++) {
            const a = actions[i];
            const btn = document.createElement('button');
            btn.className = 'action-btn';
            btn.textContent = a.label;
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                a.action();
            });
            $actions.appendChild(btn);
        }
    }

    // Build sidebar
    const scenarioBtns = [];
    for (let i = 0; i < scenarios.length; i++) {
        const btn = document.createElement('button');
        btn.className = 'scenario-btn';
        btn.textContent = scenarios[i].title;
        const idx = i;
        btn.addEventListener('click', () => loadScenario(idx));
        $list.appendChild(btn);
        scenarioBtns.push(btn);
    }

    // Handle canvas clicks (pointer events; screenToWorld reads the cached rect
    // and writes into the shared tmpVec, so nothing allocates per click).
    canvas.addEventListener('pointerdown', (e) => {
        cam.screenToWorld(e.clientX - canvasRect.left, e.clientY - canvasRect.top, tmpVec);
        const s = scenarios[currentScenarioIndex];
        if (s.onClick) s.onClick(tmpVec.x, tmpVec.y);
    });

    // ---------------------------------------------------------
    //  RENDERING & GAME LOOP
    // ---------------------------------------------------------

    // Dummy landmarks for visual reference
    const landmarks = Array.from({length: 40}, (_, i) => ({
        x: 100 + (Math.sin(i * 123) * 0.5 + 0.5) * (WORLD_W - 200),
        y: 100 + (Math.cos(i * 321) * 0.5 + 0.5) * (WORLD_H - 200),
        r: 15 + (i % 3) * 10
    }));

    function drawWorld() {
        // Base grid
        ctx.fillStyle = '#13131d';
        ctx.fillRect(0, 0, WORLD_W, WORLD_H);
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 1;
        for (let x = 0; x <= WORLD_W; x += 100) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, WORLD_H);
            ctx.stroke();
        }
        for (let y = 0; y <= WORLD_H; y += 100) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(WORLD_W, y);
            ctx.stroke();
        }

        // World Bounds
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.3)';
        ctx.lineWidth = 2;
        ctx.strokeRect(0, 0, WORLD_W, WORLD_H);

        // Landmarks (indexed for -- no per-frame iterator/closure allocation)
        ctx.fillStyle = 'rgba(167, 139, 250, 0.2)';
        ctx.strokeStyle = 'rgba(167, 139, 250, 0.5)';
        for (let i = 0; i < landmarks.length; i++) {
            const l = landmarks[i];
            ctx.beginPath();
            ctx.arc(l.x, l.y, l.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        }

        // Boss
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(boss.x, boss.y, boss.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '12px ui-monospace, SFMono-Regular, Menlo, monospace';
        ctx.fillText('BOSS', boss.x - 14, boss.y - boss.size - 8);

        // Ally
        if (ally.active) {
            ctx.fillStyle = '#34d399';
            ctx.beginPath();
            ctx.arc(ally.x, ally.y, ally.size, 0, Math.PI * 2);
            ctx.fill();
        }

        // Player
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(player.x - player.size, player.y - player.size, player.size * 2, player.size * 2);
    }

    function drawParallaxLayer(color, size, count, offsetSeed) {
        ctx.fillStyle = color;
        for (let i = 0; i < count; i++) {
            const x = (Math.sin(i * offsetSeed) * 0.5 + 0.5) * WORLD_W;
            const y = (Math.cos(i * offsetSeed) * 0.5 + 0.5) * WORLD_H;
            ctx.fillRect(x, y, size, size);
        }
    }

    let lastTime = performance.now();

    function loop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        // Player Input
        player.vx = 0;
        player.vy = 0;
        if (keys['w'] || keys['arrowup']) player.vy = -1;
        if (keys['s'] || keys['arrowdown']) player.vy = 1;
        if (keys['a'] || keys['arrowleft']) player.vx = -1;
        if (keys['d'] || keys['arrowright']) player.vx = 1;

        const len = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
        if (len > 0) {
            player.vx /= len;
            player.vy /= len;
        }

        player.x += player.vx * player.speed * dt;
        player.y += player.vy * player.speed * dt;

        // Clamp player to world
        player.x = Math.max(player.size, Math.min(WORLD_W - player.size, player.x));
        player.y = Math.max(player.size, Math.min(WORLD_H - player.size, player.y));

        // Ally wander logic
        if (ally.active) {
            ally.x += ally.vx * 150 * dt;
            ally.y += ally.vy * 150 * dt;
            if (ally.x < 100 || ally.x > WORLD_W - 100) ally.vx *= -1;
            if (ally.y < 100 || ally.y > WORLD_H - 100) ally.vy *= -1;
        }

        // 1. Update Camera
        cam.update(dt, player.x, player.y, player.vx * player.speed, player.vy * player.speed);

        // 2. Render Setup
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Render Parallax Layers (if active)
        if (cam._parallax.activeCount > 0) {
            ctx.save();
            cam.applyParallax('sky', ctx);
            drawParallaxLayer('rgba(255,255,255,0.05)', 4, 100, 1.1);
            ctx.restore();
            ctx.save();
            cam.applyParallax('mountains', ctx);
            drawParallaxLayer('rgba(167,139,250,0.1)', 40, 20, 2.2);
            ctx.restore();
        }

        // Render Main World
        ctx.save();
        cam.apply(ctx);
        drawWorld();
        cam.debug(ctx); // World-space debug info
        ctx.restore();

        // Render Foreground Parallax
        if (cam._parallax.activeCount > 0) {
            ctx.save();
            cam.applyParallax('foreground', ctx);
            drawParallaxLayer('rgba(52,211,153,0.15)', 80, 15, 3.3);
            ctx.restore();
        }

        // 3. Render HUD
        cam.debugHUD(ctx);

        requestAnimationFrame(loop);
    }

    // Start Tour
    loadScenario(0);
    requestAnimationFrame(loop);

    // Optional layout profiler (D-i): only when the URL carries #profile. A
    // normal load makes ZERO network requests; offline #profile logs one warning
    // and the demo keeps running. Never referenced from the frame loop.
    if (location.hash === '#profile') {
        import('https://esm.sh/@zakkster/lite-layout-profiler')
            .then((m) => {
                const create = m.createLayoutProfiler || (m.default && m.default.createLayoutProfiler);
                if (typeof create !== 'function') {
                    console.warn('demo: layout profiler API missing -- running without it');
                    return;
                }
                // Read window.__layout.summary() in DevTools after driving the page
                window.__layout = create({ warnToConsole: true });
                window.addEventListener('beforeunload', () => window.__layout.destroy(), { once: true });
            })
            .catch(() => console.warn('demo: layout profiler unavailable (offline) -- running without it'));
    }

</script>
</body>
</html>
